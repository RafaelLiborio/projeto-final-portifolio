<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio Gustavo Guanabara</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="shortcut icon" href="favicon.svg" type="image/x-icon">
    <script src="https://kit.fontawesome.com/164856bdc3.js" crossorigin="anonymous"></script>
</head>

<body>
    <header>
        <nav id="menu">
            <ul>
                <li><a href="#"><i class="fa-solid fa-house"></i></a></li>
                <li><a href="#"><i class="fa-solid fa-brain"></i></a></li>
                <li><a href="#"><i class="fa-solid fa-graduation-cap"></i></a></li>
                <li><a href="#"><i class="fa-solid fa-trowel-bricks"></i></a></li>
                <li><a href="#"><i class="fa-solid fa-moon"></i></a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="ficha">
            <img src="imagens/rafael-perfil.jpeg" alt="" class="foto">
            <h1>Rafael Libório</h1>
            <p>Cursando Engenharia de Software, Inglês, estudante de programação</p>
            <div id="social">
                <a href="https://www.instagram.com/rafa.etc0?igsh=MXZzOHEwYjhpMzMzZA==" target="_blank"><i
                        class="fa-brands fa-instagram"></i></a>
                <a href="https://github.com/RafaelLiborio/" target="_blank"><i class="fa-brands fa-github"></i></a>
                <a href="https://www.cursoemvideo.com/" target="_blank"><i class="fa-solid fa-globe"></i></a>
            </div>
        </section>

        <section id="detalhes">
            <article id="video">
                <h2><i class="fa-solid fa-handshake"></i> Deixe-me apresentar</h2>
                <div class="video-container">
                    <!-- Colar video ( iframe ) ao chegar em casa -->
                </div>
            </article> <!-- Fim article video-->

            <article id="skills">
                <h2><i class="fa-solid fa-brain"></i> Minhas skills</h2>

                <div id="skill-container">
                    <div class="item">
                        <div class="info">
                            <span class="nome">
                               <i class="fa-solid fa-code"></i> HTML5
                            </span>
                            <span class="porcent">
                                90%
                            </span>
                        </div>
                        <div class="barra">
                            <div class="progresso" style="width: 90%;"></div>
                        </div>
                    </div>

                    <div class="item">
                        <div class="info">
                            <span class="nome">
                               <i class="fa-solid fa-code"></i> CSS3
                            </span>
                            <span class="porcent">
                                80%
                            </span>
                        </div>
                        <div class="barra">
                            <div class="progresso" style="width: 80%;"></div>
                        </div>
                    </div>

                    <div class="item">
                        <div class="info">
                            <span class="nome">
                               <i class="fa-solid fa-code"></i> C#
                            </span>
                            <span class="porcent">
                                40%
                            </span>
                        </div>
                        <div class="barra">
                            <div class="progresso" style="width: 40%;"></div>
                        </div>
                    </div>

                    <div class="item">
                        <div class="info">
                            <span class="nome">
                               <i class="fa-solid fa-person-rays"></i> Comunicação
                            </span>
                            <span class="porcent">
                                95%
                            </span>
                        </div>
                        <div class="barra">
                            <div class="progresso" style="width: 95%;"></div>
                        </div>
                    </div>

                    <div class="item">
                        <div class="info">
                            <span class="nome">
                               <i class="fa-solid fa-person-rays"></i> Trabalho em equipe
                            </span>
                            <span class="porcent">
                                100%
                            </span>
                        </div>
                        <div class="barra">
                            <div class="progresso" style="width: 100%;"></div>
                        </div>
                    </div>

                    <div class="item">
                        <div class="info">
                            <span class="nome">
                               <i class="fa-solid fa-person-rays"></i> Adaptabilidade
                            </span>
                            <span class="porcent">
                                85%
                            </span>
                        </div>
                        <div class="barra">
                            <div class="progresso" style="width: 85%;"></div>
                        </div>
                    </div>

                    <div class="item">
                        <div class="info">
                            <span class="nome">
                               <i class="fa-solid fa-person-rays"></i> Liderança
                            </span>
                            <span class="porcent">
                                70%
                            </span>
                        </div>
                        <div class="barra">
                            <div class="progresso" style="width: 70%;"></div>
                        </div>
                    </div>

                </div>

            </article> <!-- Fim article skills-->

            <article id="formacao">
                <h2><i class="fa-solid fa-graduation-cap"></i> Formação</h2>
            </article> <!-- Fim article formacao-->

            <article id="projetos">
                <h2><i class="fa-solid fa-trowel-bricks"></i> Projetos</h2>
            </article> <!-- Fim article projetos-->
        </section>
    </main>

    <footer>

    </footer>

    <script src="scripts/script.js"></script>
</body>

</html>
